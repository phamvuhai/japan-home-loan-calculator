name: Collect official mortgage rates
on:
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 20 * * *'
      timezone: 'Asia/Tokyo'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rate-sync.yml'
      - 'scripts/sync-rates.js'
      - 'lib/bank-source.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-loan-rate-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch each official bank once and validate the data
        env:
          RATE_SLOT: "${{ github.event.schedule == '30 8 * * *' && '08:30' || github.event.schedule == '30 20 * * *' && '20:30' || 'initial' }}"
        run: node scripts/sync-rates.js
      - name: Commit the centralized snapshot and logs
        run: |
          git config user.name "home-loan-rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/fetch-logs.json
          if git diff --cached --quiet; then
            echo "No snapshot change"
          else
            git commit -m "data: scheduled official mortgage rate snapshot"
            git push origin HEAD:main
          fi
